services:
  postgres:
    image: postgres:latest
    container_name: studenthub-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: studenthub
      POSTGRES_DB: studenthub
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
